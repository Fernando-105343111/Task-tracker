name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run unit and PostgreSQL integration tests with coverage
        env:
          TASK_TEST_PROJECT: task-tracker-${{ github.run_id }}-${{ github.run_attempt }}
        run: sh scripts/test.sh

      - name: Retain test reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/
            evidence-local/tests.log
          retention-days: 14

  runtime:
    name: Build runtime image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app_image: ${{ steps.image.outputs.app_image }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select the lowercase GHCR image reference
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "app_image=$image" >> "$GITHUB_OUTPUT"
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build the runtime target with the tested commit SHA
        run: |
          docker build --target runtime --build-arg COMMIT_SHA="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$APP_IMAGE" .

      - name: Verify the embedded commit SHA
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$APP_IMAGE")" = "$GITHUB_SHA"
          docker run --rm --entrypoint python "$APP_IMAGE" \
            -c 'import os, sys; assert os.environ["COMMIT_SHA"] == sys.argv[1]' "$GITHUB_SHA"

      - name: Save the built image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/runtime-image.tar" "$APP_IMAGE"

      - name: Transfer the built image without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-image-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish runtime image to GHCR
    needs: runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      APP_IMAGE: ${{ needs.runtime.outputs.app_image }}
    steps:
      - name: Download the built image from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-image-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-image

      - name: Load the built image
        run: docker load --input "$RUNNER_TEMP/runtime-image/runtime-image.tar"

      - name: Log in to GHCR with the workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the SHA-tagged image
        run: docker push "$APP_IMAGE"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  staging:
    name: Deploy and test staging
    needs: [runtime, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: task-tracker-staging
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    outputs:
      approved_image: ${{ steps.approve.outputs.image }}

    env:
      APP_IMAGE: ${{ needs.runtime.outputs.app_image }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure staging SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          ssh_dir="$RUNNER_TEMP/staging-ssh"
          mkdir -p "$ssh_dir"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$STAGING_SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          ssh-keyscan -T 10 -p 22 -H "$STAGING_HOST" > "$ssh_dir/known_hosts"
          test -s "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host staging
            HostName $STAGING_HOST
            User $STAGING_USER
            Port 22
            IdentityFile $ssh_dir/key
            UserKnownHostsFile $ssh_dir/known_hosts
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

      - name: Copy Compose configuration to staging
        run: |
          scp -F "$RUNNER_TEMP/staging-ssh/config" \
            compose.yaml staging:/opt/task-tracker-staging/compose.yaml

      - name: Authenticate staging to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
          ssh -F "$RUNNER_TEMP/staging-ssh/config" staging \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy exact image to staging
        run: |
          ssh -F "$RUNNER_TEMP/staging-ssh/config" staging \
            bash -se -- "$APP_IMAGE" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          export APP_IMAGE="$1" COMMIT_SHA="$2" APP_BIND=127.0.0.1 APP_PORT=8080
          cd /opt/task-tracker-staging

          echo "Deploying exact image: $APP_IMAGE"
          docker pull "$APP_IMAGE"
          echo "Explicit docker pull succeeded: $APP_IMAGE"
          docker compose -f compose.yaml -f compose.staging.yaml \
            up -d --no-build --remove-orphans

          container=$(docker compose -f compose.yaml -f compose.staging.yaml ps -q web)
          test -n "$container"
          test "$(docker inspect --format '{{.Config.Image}}' "$container")" = "$APP_IMAGE"
          test "$(docker inspect --format '{{.Image}}' "$container")" = \
            "$(docker image inspect --format '{{.Id}}' "$APP_IMAGE")"
          echo "Running web container uses expected image: $APP_IMAGE"

          wait_for() {
            for attempt in $(seq 1 20); do
              if [ "$(curl -sS --connect-timeout 2 --max-time 3 \
                -o /dev/null -w '%{http_code}' "$1")" = 200 ]; then
                echo "$1 passed: HTTP 200"
                return 0
              fi
              sleep 3
            done
            echo "$1 failed to return HTTP 200 within the retry window" >&2
            return 1
          }
          wait_for http://127.0.0.1:8080/health
          wait_for http://127.0.0.1:8080/ready
          curl -fsS --max-time 5 http://127.0.0.1:8080/version | \
            docker exec -i "$container" python -c \
            'import json, sys; assert json.load(sys.stdin)["commit"] == sys.argv[1], "Staging commit mismatch"' "$COMMIT_SHA"
          echo "Staging /version matches commit: $COMMIT_SHA"
          REMOTE

      - name: Create SSH tunnel to staging
        run: |
          ssh -F "$RUNNER_TEMP/staging-ssh/config" \
            -o ExitOnForwardFailure=yes \
            -N -L 127.0.0.1:18080:127.0.0.1:8080 staging \
            > "$RUNNER_TEMP/staging-tunnel.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/staging-tunnel.pid"

      - name: Wait for the SSH tunnel to reach staging
        run: |
          for attempt in $(seq 1 20); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/staging-tunnel.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/staging-tunnel.log" >&2
              exit 1
            fi
            if [ "$(curl -sS --connect-timeout 2 --max-time 3 -o /dev/null \
              -w '%{http_code}' http://127.0.0.1:18080/ready)" = 200 ]; then
              echo "SSH tunnel reachable: staging /ready returned HTTP 200"
              exit 0
            fi
            sleep 3
          done
          echo "SSH tunnel did not reach a ready staging application" >&2
          cat "$RUNNER_TEMP/staging-tunnel.log" >&2
          exit 1

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright acceptance tests against staging
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e:ci

      - name: Retain Playwright evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Approve tested image for later production promotion
        id: approve
        run: |
          curl -fsS --max-time 5 http://127.0.0.1:18080/version | \
            python3 -c 'import json, sys; assert json.load(sys.stdin)["commit"] == sys.argv[1], "Staging commit changed during E2E"' "$GITHUB_SHA"
          echo "image=$APP_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Stop staging SSH tunnel
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/staging-tunnel.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/staging-tunnel.pid")" 2>/dev/null || true
          fi

      - name: Log staging out of GHCR
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/staging-ssh/config" ]; then
            ssh -F "$RUNNER_TEMP/staging-ssh/config" staging \
              'docker logout ghcr.io' || echo "Warning: staging GHCR logout failed" >&2
          fi

      - name: Remove temporary SSH key material
        if: always()
        run: rm -rf "$RUNNER_TEMP/staging-ssh"

      - name: Report final staging gate result
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
        run: |
          if [ "$GATE_STATUS" = success ]; then
            result="Staging gate PASS: $APP_IMAGE"
          else
            result="Staging gate FAIL ($GATE_STATUS): $APP_IMAGE"
          fi
          echo "$result"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy and verify production
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: read

    env:
      APP_IMAGE: ${{ needs.staging.outputs.approved_image }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}

    steps:
      - name: Check out the approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure production SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Copy Compose configuration to production
        run: |
          scp -i ~/.ssh/prod_key -o IdentitiesOnly=yes \
            compose.yaml \
            "$PROD_USER@$PROD_HOST:/opt/task-tracker/compose.yaml"

      - name: Authenticate production to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
          ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy approved image to production
        run: |
          ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" "
              set -e
              cd /opt/task-tracker

              docker pull '$APP_IMAGE'

              APP_IMAGE='$APP_IMAGE' COMMIT_SHA='$GITHUB_SHA' \
                docker compose up -d --no-build --remove-orphans

              APP_IMAGE='$APP_IMAGE' COMMIT_SHA='$GITHUB_SHA' \
                docker compose ps
            "

      - name: Verify production application and database
        run: |
          ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" "
              set -e

              for attempt in \$(seq 1 24); do
                if curl -fsS http://127.0.0.1:8080/ > /dev/null && \
                   curl -fsS http://127.0.0.1:8080/api/tasks > /dev/null; then
                  echo 'Production application and database are responding'
                  exit 0
                fi

                sleep 5
              done

              echo 'Production verification failed'
              exit 1
            "

      - name: Verify exact approved image is running
        run: |
          ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" "
              set -e
              cd /opt/task-tracker

              container_id=\$(APP_IMAGE='$APP_IMAGE' COMMIT_SHA='$GITHUB_SHA' \
                docker compose ps -q web)

              test -n \"\$container_id\"

              running_image=\$(docker inspect \"\$container_id\" \
                --format '{{.Config.Image}}')

              echo \"Running image: \$running_image\"
              echo \"Approved image: $APP_IMAGE\"

              test \"\$running_image\" = '$APP_IMAGE'

              revision=\$(docker image inspect '$APP_IMAGE' \
                --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}')

              echo \"Embedded revision: \$revision\"
              test \"\$revision\" = '$GITHUB_SHA'
            "

      - name: Log production out of GHCR
        if: always()
        run: |
          ssh -i ~/.ssh/prod_key -o IdentitiesOnly=yes \
            "$PROD_USER@$PROD_HOST" \
            "docker logout ghcr.io || true"
