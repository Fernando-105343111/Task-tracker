name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run unit and PostgreSQL integration tests with coverage
        env:
          TASK_TEST_PROJECT: task-tracker-${{ github.run_id }}-${{ github.run_attempt }}
        run: sh scripts/test.sh

      - name: Retain test reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/
            evidence-local/tests.log
          retention-days: 14
