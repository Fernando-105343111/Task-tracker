name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run unit and PostgreSQL integration tests with coverage
        env:
          TASK_TEST_PROJECT: task-tracker-${{ github.run_id }}-${{ github.run_attempt }}
        run: sh scripts/test.sh

      - name: Retain test reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/
            evidence-local/tests.log
          retention-days: 14

  runtime:
    name: Build runtime image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      app_image: ${{ steps.image.outputs.app_image }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select the lowercase GHCR image reference
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          echo "app_image=$image" >> "$GITHUB_OUTPUT"
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build the runtime target with the tested commit SHA
        run: |
          docker build --target runtime --build-arg COMMIT_SHA="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$APP_IMAGE" .

      - name: Verify the embedded commit SHA
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$APP_IMAGE")" = "$GITHUB_SHA"
          docker run --rm --entrypoint python "$APP_IMAGE" \
            -c 'import os, sys; assert os.environ["COMMIT_SHA"] == sys.argv[1]' "$GITHUB_SHA"

      - name: Save the built image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/runtime-image.tar" "$APP_IMAGE"

      - name: Transfer the built image without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-image-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish runtime image to GHCR
    needs: runtime
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      APP_IMAGE: ${{ needs.runtime.outputs.app_image }}
    steps:
      - name: Download the built image from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-image-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-image

      - name: Load the built image
        run: docker load --input "$RUNNER_TEMP/runtime-image/runtime-image.tar"

      - name: Log in to GHCR with the workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the SHA-tagged image
        run: docker push "$APP_IMAGE"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
        
  staging:
    name: Deploy and test staging
    needs: [runtime, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    outputs:
      approved_image: ${{ steps.approve.outputs.image }}

    env:
      APP_IMAGE: ${{ needs.runtime.outputs.app_image }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure staging SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Copy Compose configuration to staging
        run: |
          scp -i ~/.ssh/staging_key -o IdentitiesOnly=yes \
            compose.yaml \
            "$STAGING_USER@$STAGING_HOST:/opt/task-tracker-staging/compose.yaml"

      - name: Authenticate staging to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes \
            "$STAGING_USER@$STAGING_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Deploy exact image to staging
        run: |
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes \
            "$STAGING_USER@$STAGING_HOST" "
              set -e
              cd /opt/task-tracker-staging

              APP_IMAGE='$APP_IMAGE' COMMIT_SHA='$GITHUB_SHA' \
                docker compose -f compose.yaml -f compose.staging.yaml pull web

              APP_IMAGE='$APP_IMAGE' COMMIT_SHA='$GITHUB_SHA' \
                docker compose -f compose.yaml -f compose.staging.yaml \
                up -d --no-build --remove-orphans

              APP_IMAGE='$APP_IMAGE' COMMIT_SHA='$GITHUB_SHA' \
                docker compose -f compose.yaml -f compose.staging.yaml ps
            "

      - name: Create SSH tunnel to staging
        run: |
          ssh -i ~/.ssh/staging_key \
            -o IdentitiesOnly=yes \
            -o ExitOnForwardFailure=yes \
            -N -L 18080:127.0.0.1:8080 \
            "$STAGING_USER@$STAGING_HOST" &

          echo $! > "$RUNNER_TEMP/staging-tunnel.pid"

      - name: Wait for staging application
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:18080/ > /dev/null; then
              echo "Staging application is ready"
              exit 0
            fi

            sleep 5
          done

          echo "Staging application did not become ready"
          exit 1

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright acceptance tests against staging
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
        run: npx playwright test

      - name: Retain Playwright evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: staging-playwright-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Approve tested image for production
        id: approve
        run: echo "image=$APP_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Stop staging SSH tunnel
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/staging-tunnel.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/staging-tunnel.pid")" 2>/dev/null || true
          fi

      - name: Log staging out of GHCR
        if: always()
        run: |
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes \
            "$STAGING_USER@$STAGING_HOST" \
            "docker logout ghcr.io || true"
