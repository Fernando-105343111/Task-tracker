[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "unit: validation and HTTP behaviour without a live database",
  "integration: application behaviour against an isolated PostgreSQL database",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
