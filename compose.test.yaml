# Independent of compose.yaml: never mounts the development/production DB volume.
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasktracker_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_only_password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d tasktracker_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://test_user:test_only_password@test-db:5432/tasktracker_test
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./reports:/reports
